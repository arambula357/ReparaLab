name: Release package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B clean install
      - name: Package application and license notices
        run: python3 scripts/package_release.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          zip="target/release/ReparaLab-${version}.zip"
          checksum="target/release/ReparaLab-${version}.sha256"
          notes="docs/releases/RELEASE-v${version}.md"
          test -f "$zip" && test -f "$checksum" && test -f "$notes"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$zip" "$checksum" --clobber
          else
            gh release create "$RELEASE_TAG" "$zip" "$checksum" \
              --title "ReparaLab ${RELEASE_TAG}" --notes-file "$notes" --verify-tag
          fi
